name: Publicar rotas a partir do Google Drive

on:
  schedule:
    # Confere a pasta a cada 20 min das 5h as 23h (UTC-3, Araguaina, sem
    # horario de verao). Sem arquivo novo, a execucao termina sem publicar.
    # Muitas execucoes porque o GitHub perde/atrasa varias delas; evita o
    # minuto :00, que e' o mais congestionado.
    - cron: "7,27,47 8-23 * * *"   # 05:07 ate' 20:47
    - cron: "7,27,47 0,1 * * *"    # 21:07 ate' 22:47
    - cron: "7 2 * * *"            # 23:07
  workflow_dispatch: {}

# Uma execucao por vez, para duas nao tentarem publicar ao mesmo tempo.
concurrency:
  group: publicar-rotas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar identidade do git
        run: |
          git config user.name "RotaCerta Bot"
          git config user.email "rotacerta-bot@users.noreply.github.com"

      - name: Rodar o vigia do Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          ORIGEM_LAT: ${{ vars.ORIGEM_LAT }}
          ORIGEM_LON: ${{ vars.ORIGEM_LON }}
        run: python googledrive_watch_and_publish.py

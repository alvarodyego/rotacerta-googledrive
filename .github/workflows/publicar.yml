name: Publicar rotas a partir do Google Drive

on:
  schedule:
    # 22h,01h,03h,10h,15h UTC = 19h,22h,00h,07h,12h (Araguaina; arquivo do dia chega 17-19h) -- antes: meia-noite e meio-dia em Araguaina/TO (UTC-3, sem
    # horario de verao). O minuto :23 (e nao :00) e' de proposito: o GitHub
    # atrasa muito os disparos na hora cheia (medido: 3 a 5 h de atraso).
    - cron: "23 22,1,3,10,15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar identidade do git
        run: |
          git config user.name "RotaCerta Bot"
          git config user.email "rotacerta-bot@users.noreply.github.com"

      - name: Rodar o vigia do Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          ORIGEM_LAT: ${{ vars.ORIGEM_LAT }}
          ORIGEM_LON: ${{ vars.ORIGEM_LON }}
        run: python googledrive_watch_and_publish.py
